<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#faf8f2">
<title>珍馐水果合成</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #faf8f2;
  }
  body {
    touch-action: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  canvas {
    display: block;
    touch-action: none;
  }
  #tip {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 10px;
    margin: 0 auto;
    max-width: 420px;
    text-align: center;
    font: 12px/1.7 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #a8988a;
    letter-spacing: .3px;
    pointer-events: none;
  }
  @media (max-width: 640px) {
    #tip { display: none; }
  }
</style>
</head>
<body>
<div id="tip">方向键 / 鼠标按住拖拽 也能滑动　　R 重开</div>

<script src="js/platform.js"></script>
<script src="js/tile.js"></script>
<script src="js/grid.js"></script>
<script src="js/storage_manager.js"></script>
<script src="js/input_manager.js"></script>
<script src="js/renderer.js"></script>
<script src="js/game_manager.js"></script>
<script>
(function () {
  function boot() {
    try {
      window.__game = new GameManager(4, InputManager, Renderer, StorageManager);
    } catch (e) {
      document.getElementById("tip").textContent = "启动失败：" + e.message;
    }
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
