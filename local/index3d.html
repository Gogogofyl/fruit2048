<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#faf6ee">
<title>珍馐水果合成 · 3D</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #faf6ee;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  canvas { display: block; position: fixed; inset: 0; }

  #hud {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0 16px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    z-index: 10;
    pointer-events: none;
  }
  #hud .brand {
    font-size: 15px;
    letter-spacing: 1px;
    color: #8d7c68;
    font-weight: 600;
    padding-top: 6px;
    flex: 1;
    white-space: nowrap;
  }
  .pill {
    background: rgba(255, 252, 245, .82);
    border: 1px solid rgba(200, 182, 158, .5);
    border-radius: 10px;
    padding: 5px 12px 6px;
    text-align: center;
    min-width: 62px;
    box-shadow: 0 2px 8px rgba(150, 120, 90, .08);
  }
  .pill label {
    display: block;
    font-size: 9px;
    letter-spacing: 1.5px;
    color: #b2a08c;
  }
  .pill span {
    display: block;
    font-size: 18px;
    font-weight: 700;
    color: #5d4c3c;
    line-height: 1.25;
    font-variant-numeric: tabular-nums;
  }

  button {
    pointer-events: auto;
    border: 0;
    border-radius: 10px;
    background: #e9b98a;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    padding: 9px 16px;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(200, 140, 90, .28);
    transition: transform .12s, box-shadow .12s, background .12s;
    font-family: inherit;
  }
  button:active { transform: translateY(1px); box-shadow: 0 1px 4px rgba(200, 140, 90, .3); }
  button:disabled {
    background: #ded2c2;
    color: #fdf9f3;
    box-shadow: none;
    cursor: default;
  }

  /* 底部工具条：回退 / 消除 / 新游戏 */
  #tools {
    position: fixed;
    left: 0; right: 0;
    bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    display: flex;
    justify-content: center;
    gap: 10px;
    z-index: 10;
    padding: 0 12px;
  }
  #tools button {
    background: rgba(255, 252, 245, .92);
    color: #8a7660;
    border: 1px solid rgba(200, 182, 158, .55);
    box-shadow: 0 2px 10px rgba(150, 120, 90, .1);
    padding: 9px 14px;
  }
  #btn-new { background: #e9b98a; color: #fff; border-color: transparent; }

  #tip {
    position: fixed;
    left: 0; right: 0;
    bottom: calc(66px + env(safe-area-inset-bottom, 0px));
    text-align: center;
    font-size: 12px;
    color: #a8988a;
    letter-spacing: .3px;
    pointer-events: none;
    z-index: 10;
  }

  #pickhint {
    position: fixed;
    left: 50%;
    top: calc(84px + env(safe-area-inset-top, 0px));
    transform: translateX(-50%);
    background: rgba(233, 185, 138, .96);
    color: #fff;
    font-size: 13px;
    padding: 8px 16px;
    border-radius: 999px;
    box-shadow: 0 6px 18px rgba(200, 140, 90, .3);
    z-index: 15;
    display: none;
  }
  #pickhint.show { display: block; }

  /* 覆盖层通用 */
  .sheet {
    position: fixed;
    inset: 0;
    background: rgba(250, 246, 238, .52);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 30;
    padding: 20px;
  }
  .sheet.show { display: flex; }

  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(250, 246, 238, .74);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease;
    z-index: 20;
  }
  #overlay.show { opacity: 1; pointer-events: auto; }

  .card {
    background: #fffaf0;
    border-radius: 18px;
    padding: 26px 32px 22px;
    text-align: center;
    box-shadow: 0 14px 44px rgba(130, 100, 70, .2);
    min-width: 220px;
  }
  .card.wide { min-width: 300px; max-width: 420px; width: 100%; }

  .card-title {
    font-size: 20px;
    font-weight: 700;
    color: #5d4c3c;
    letter-spacing: .5px;
  }
  .card-sub {
    margin: 8px 0 18px;
    font-size: 12px;
    color: #a2917d;
    letter-spacing: .5px;
    line-height: 1.6;
  }
  .card-sub.tight { margin-bottom: 16px; }

  #ov-title { font-size: 20px; font-weight: 700; color: #5d4c3c; letter-spacing: .5px; }
  #ov-score { margin: 10px 0 18px; font-size: 13px; color: #a2917d; letter-spacing: .5px; }
  .card button { margin: 5px 5px 0; }
  #btn-continue { background: #9ec27a; }

  /* 主菜单按钮竖排 */
  .menu-card button {
    display: block;
    width: 100%;
    margin: 8px 0 0;
    padding: 11px 16px;
    font-size: 14px;
    background: #f3e7d8;
    color: #7c6650;
    box-shadow: 0 2px 8px rgba(160, 130, 100, .12);
  }
  .menu-card button.primary { background: #e9b98a; color: #fff; }
  .menu-card button.quit { background: #f6e2e2; color: #a87474; }

  /* 首次收进图鉴时的提示 */
  #toast {
    position: fixed;
    left: 50%;
    top: calc(110px + env(safe-area-inset-top, 0px));
    transform: translateX(-50%) translateY(-8px);
    background: rgba(233, 185, 138, .97);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    padding: 9px 18px;
    border-radius: 999px;
    box-shadow: 0 8px 22px rgba(200, 140, 90, .34);
    z-index: 16;
    opacity: 0;
    pointer-events: none;
    transition: opacity .24s ease, transform .24s ease;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 收藏家图鉴 */
  .col-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin: 14px 0 18px;
  }
  .col-item {
    background: rgba(243, 231, 216, .62);
    border: 1px solid rgba(220, 203, 180, .55);
    border-radius: 12px;
    padding: 8px 4px 7px;
    text-align: center;
  }
  .col-item img {
    width: 56px;
    height: 56px;
    object-fit: contain;
    display: block;
    margin: 0 auto 2px;
  }
  .col-item.locked img { filter: grayscale(1) brightness(.62) opacity(.45); }
  .col-item .col-name {
    display: block;
    font-size: 11px;
    color: #8a7660;
    line-height: 1.45;
  }
  .col-item .col-lv {
    display: block;
    font-size: 10px;
    color: #b08e6a;
    font-variant-numeric: tabular-nums;
  }
  .col-item.locked .col-name { color: #c0b0a0; }
  .col-item.locked .col-lv { color: #cbbdac; }

  /* 排行榜 */
  .board-list {    margin: 12px 0 16px;
    text-align: left;
    max-height: 52vh;
    overflow-y: auto;
  }
  .board-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 10px;
    border-radius: 9px;
    font-size: 13px;
    color: #7c6650;
  }
  .board-row:nth-child(odd) { background: rgba(240, 228, 211, .55); }
  .board-rank {
    width: 22px;
    font-weight: 700;
    color: #b08e6a;
    font-variant-numeric: tabular-nums;
  }
  .board-score {
    flex: 1;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .board-tile { color: #a2917d; font-size: 12px; }
  .board-empty { padding: 18px 6px; font-size: 13px; color: #a2917d; text-align: center; }

  /* 设置项 */
  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin: 12px 0 0;
  }
  .setting-label {
    font-size: 13px;
    color: #8a7660;
    white-space: nowrap;
  }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  /* 主菜单里的分段控件不能被整行按钮的宽度规则吃掉 */
  .menu-card .seg { justify-content: flex-start; margin-top: 8px; }
  .menu-card .seg button { display: inline-block; width: auto; margin: 0; }
  .mode-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin: 10px 0 -2px;
  }
  .mode-row .mode-label { font-size: 12px; color: #9a8570; white-space: nowrap; }
  .vol-wrap { display: flex; align-items: center; gap: 8px; }
  .vol-wrap input[type="range"] {
    width: 132px;
    height: 4px;
    -webkit-appearance: none;
    appearance: none;
    border-radius: 2px;
    background: #efe0cd;
    outline: none;
    accent-color: #e9b98a;
  }
  .vol-wrap input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #e9b98a;
    box-shadow: 0 2px 6px rgba(200, 140, 90, .35);
    cursor: pointer;
  }
  .vol-wrap input[type="range"]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border: none;
    border-radius: 50%;
    background: #e9b98a;
    cursor: pointer;
  }
  .vol-val { font-size: 12px; color: #8a7660; width: 30px; text-align: right; }
  .seg button {
    margin: 0;
    padding: 6px 12px;
    font-size: 12px;
    background: #f3e7d8;
    color: #a2917d;
    box-shadow: none;
  }
  .seg button.on {
    background: #e9b98a;
    color: #fff;
    box-shadow: 0 2px 8px rgba(200, 140, 90, .28);
  }
  #settings-back { margin-top: 18px; }

  @media (max-width: 480px) {
    #hud { padding-left: 10px; padding-right: 10px; gap: 6px; }
    #hud .brand { font-size: 12px; letter-spacing: 0; }
    .pill { min-width: 50px; padding: 4px 8px 5px; }
    .pill span { font-size: 15px; }
    #hud button { padding: 8px 11px; font-size: 12px; }
    #tools { gap: 7px; padding: 0 8px; }
    #tools button { padding: 8px 10px; font-size: 12px; }
    .card { padding: 22px 18px 18px; }
    .card.wide { min-width: 0; }
    .setting-row { flex-direction: column; align-items: flex-start; gap: 6px; }
    .seg { justify-content: flex-start; }
    .col-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .col-item img { width: 46px; height: 46px; }
    #toast { font-size: 12px; padding: 8px 14px; }
  }
</style>
</head>
<body>

<div id="hud">
  <div class="brand">珍馐水果合成</div>
  <div class="pill"><label>BEST</label><span id="hud-best">0</span></div>
  <div class="pill"><label>SCORE</label><span id="hud-score">0</span></div>
  <button id="btn-menu">菜单</button>
</div>

<div id="tip">方向键 / 鼠标按住拖拽 也能滑动　　R 重开</div>

<div id="tools">
  <button id="btn-undo">回退上一步</button>
  <button id="btn-erase">消除一格</button>
  <button id="btn-new">新游戏</button>
</div>

<div id="pickhint">点击棋盘上的方块即可消除</div>

<div id="toast"></div>

<div id="overlay">
  <div class="card">
    <div id="ov-title">本局结束</div>
    <div id="ov-score"></div>
    <button id="btn-continue" style="display:none">继续挑战</button>
    <button id="btn-restart">再来一局</button>
  </div>
</div>

<div id="menu" class="sheet">
  <div class="card menu-card">
    <div class="card-title">珍馐水果合成</div>
    <div class="card-sub">3D 水果 2048 · 本地版</div>
    <button id="m-start" class="primary">开始游戏</button>
    <div class="mode-row">
      <span class="mode-label">模式</span>
      <div class="seg" id="seg-mode">
        <button data-value="4">4×4 经典</button>
        <button data-value="5">5×5</button>
        <button data-value="6">6×6</button>
      </div>
    </div>
    <button id="m-board">排行榜</button>
    <button id="m-collection">收藏家</button>
    <button id="m-settings">游戏设置</button>
    <button id="m-quit" class="quit">退出游戏</button>
  </div>
</div>

<div id="collection" class="sheet">
  <div class="card wide">
    <div class="card-title">收藏家</div>
    <div class="card-sub tight">第一次合成出某级水果，它就会亮起来　·　已收藏 <span id="col-count">0</span> / 11</div>
    <div id="col-grid" class="col-grid"></div>
    <button id="collection-back">返回</button>
  </div>
</div>

<div id="board" class="sheet">
  <div class="card wide">
    <div class="card-title">本地排行榜</div>
    <div class="card-sub tight">只保存在这台设备上，按得分排序</div>
    <div id="board-list" class="board-list"></div>
    <button id="board-back">返回</button>
  </div>
</div>

<div id="settings" class="sheet">
  <div class="card wide">
    <div class="card-title">游戏设置</div>

    <div class="setting-row">
      <span class="setting-label">音效</span>
      <div class="seg" id="seg-sfx">
        <button data-value="on">开</button>
        <button data-value="off">关</button>
      </div>
    </div>

    <div class="setting-row">
      <span class="setting-label">背景音乐</span>
      <div class="seg" id="seg-music">
        <button data-value="on">开</button>
        <button data-value="off">关</button>
      </div>
    </div>

    <div class="setting-row">
      <span class="setting-label">音效音量</span>
      <div class="vol-wrap">
        <input type="range" id="vol-sfx" min="0" max="100" step="5" value="70">
        <span class="vol-val" id="vol-sfx-val">70</span>
      </div>
    </div>

    <div class="setting-row">
      <span class="setting-label">音乐音量</span>
      <div class="vol-wrap">
        <input type="range" id="vol-music" min="0" max="100" step="5" value="35">
        <span class="vol-val" id="vol-music-val">35</span>
      </div>
    </div>

    <div class="setting-row">
      <span class="setting-label">合成特效</span>
      <div class="seg" id="seg-fx">
        <button data-value="off">关</button>
        <button data-value="normal">标准</button>
        <button data-value="strong">强</button>
      </div>
    </div>

    <div class="setting-row">
      <span class="setting-label">背景浓度</span>
      <div class="seg" id="seg-bg">
        <button data-value="light">淡</button>
        <button data-value="normal">标准</button>
        <button data-value="deep">浓</button>
      </div>
    </div>

    <div class="setting-row">
      <span class="setting-label">每局消除次数</span>
      <div class="seg" id="seg-erase">
        <button data-value="3">3 次</button>
        <button data-value="5">5 次</button>
        <button data-value="0">不限</button>
      </div>
    </div>

    <div class="setting-row">
      <span class="setting-label">存档</span>
      <div class="seg" id="seg-save">
        <button id="save-export">导出</button>
        <button id="save-import">导入</button>
      </div>
      <input type="file" id="save-file" accept=".json,application/json" style="display:none">
    </div>

    <div class="setting-row">
      <span class="setting-label">本地数据</span>
      <div class="seg" id="seg-reset">
        <button data-value="reset">清空最高分与榜单</button>
      </div>
    </div>

    <button id="settings-back">返回</button>
  </div>
</div>

<div id="quit" class="sheet">
  <div class="card">
    <div class="card-title">已退出游戏</div>
    <div class="card-sub">成绩与设置都已保存在本地。<br>网页版无法自己关闭标签页，直接关掉这个页面即可。</div>
    <button id="quit-back" class="primary">回到游戏</button>
  </div>
</div>

<script src="js/three.min.js"></script>
<script src="js/bgm-data.js"></script>
<script src="js/fruits-data.js"></script>
<script src="js/bg-data.js"></script>
<script src="js/platform.js"></script>
<script src="js/tile.js"></script>
<script src="js/grid.js"></script>
<script src="js/storage_manager.js"></script>
<script src="js/input_manager.js"></script>
<script src="js/fruit-shapes.js"></script>
<script src="js/sfx.js"></script>
<script src="js/renderer3d.js"></script>
<script src="js/game_manager.js"></script>
<script>
(function () {
  function boot() {
    try {
      window.__game = new GameManager(4, InputManager, Renderer3D, StorageManager);
      window.__game.renderer.openMenu();
    } catch (e) {
      var tip = document.getElementById("tip");
      if (tip) tip.textContent = "3D 启动失败：" + e.message;
      throw e;
    }
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
